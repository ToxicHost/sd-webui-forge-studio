name: Bug report
description: Report a reproducible Forge Studio distribution defect
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: Distribution version and upstream commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: GPU, VRAM, RAM, Python, PyTorch, CUDA, driver, launch flags
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostic report and trace ID
  - type: dropdown
    id: stock
    attributes:
      label: Does the stock Neo UI reproduce it?
      options:
        - "Yes"
        - "No"
        - "Not tested"
